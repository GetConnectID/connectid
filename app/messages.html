<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages | ConnectID</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #ffffff;
            min-height: 100vh;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 230px;
            background: #080808;
            border-right: 1px solid #222;
            padding: 28px 18px;
        }

        .logo {
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .logo span {
            color: #ff6a00;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        nav a {
            color: #999;
            text-decoration: none;
            padding: 13px;
            border-radius: 9px;
        }

        nav a:hover,
        nav a.active {
            background: #151515;
            color: #fff;
        }

        nav a.active {
            border-left: 3px solid #ff6a00;
        }

        .main {
            flex: 1;
            display: flex;
            min-width: 0;
        }

        .conversations {
            width: 330px;
            border-right: 1px solid #222;
            padding: 28px 20px;
        }

        .conversations h1 {
            font-size: 25px;
            margin-bottom: 20px;
        }

        .search {
            width: 100%;
            padding: 12px;
            background: #111;
            border: 1px solid #252525;
            border-radius: 9px;
            color: #fff;
            outline: none;
            margin-bottom: 20px;
        }

        .conversation {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 13px;
            border-radius: 10px;
            cursor: pointer;
        }

        .conversation:hover,
        .conversation.selected {
            background: #151515;
        }

        .avatar {
            width: 43px;
            height: 43px;
            border-radius: 50%;
            background: #1a1a1a;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff6a00;
            font-weight: 700;
            flex-shrink: 0;
        }

        .person {
            font-weight: 600;
        }

        .preview {
            color: #777;
            font-size: 12px;
            margin-top: 4px;
        }

        .chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .chat-header {
            padding: 25px;
            border-bottom: 1px solid #222;
        }

        .chat-header strong {
            font-size: 17px;
        }

        .chat-header span {
            display: block;
            color: #777;
            font-size: 12px;
            margin-top: 5px;
        }

        .messages {
            flex: 1;
            padding: 30px;
        }

        .empty {
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555;
            text-align: center;
        }

        .message-input {
            display: flex;
            gap: 10px;
            padding: 20px;
            border-top: 1px solid #222;
        }

        .message-input input {
            flex: 1;
            background: #111;
            border: 1px solid #292929;
            border-radius: 10px;
            padding: 13px;
            color: #fff;
            outline: none;
        }

        .message-input button {
            background: #ff6a00;
            border: none;
            border-radius: 10px;
            padding: 0 22px;
            font-weight: 700;
            cursor: pointer;
        }

        @media (max-width: 800px) {

            .sidebar {
                width: 65px;
                padding: 20px 8px;
            }

            .logo {
                font-size: 0;
                text-align: center;
                padding: 0;
            }

            .logo::after {
                content: "CID";
                color: #ff6a00;
                font-size: 18px;
            }

            nav a {
                font-size: 0;
                text-align: center;
            }

            .conversations {
                width: 100%;
                border-right: none;
            }

            .chat {
                display: none;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            Connect<span>ID</span>
        </div>

        <nav>
            <a href="home.html">Home</a>
            <a href="messages.html" class="active">Messages</a>
            <a href="connections.html">Connections</a>
            <a href="communities.html">Communities</a>
            <a href="profile.html">Profile</a>
        </nav>

    </aside>


    <main class="main">

        <section class="conversations">

            <h1>Messages</h1>

            <input
                class="search"
                type="text"
                placeholder="Search conversations"
            >

            <div class="conversation selected">

                <div class="avatar">J</div>

                <div>
                    <div class="person">John</div>
                    <div class="preview">
                        Start a conversation
                    </div>
                </div>

            </div>

        </section>


        <section class="chat">

            <div class="chat-header">
                <strong>John</strong>
                <span>@john · Citizen</span>
            </div>


            <div class="messages">

                <div class="empty">
                    <div>
                        <strong>No messages yet.</strong>
                        <br><br>
                        Start a private conversation.
                    </div>
                </div>

            </div>


            <div class="message-input">

                <input
                    type="text"
                    placeholder="Write a message..."
                >

                <button>
                    Send
                </button>

            </div>

        </section>

    </main>

</div>

</body>
</html>
