<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | ConnectID</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #ffffff;
            min-height: 100vh;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            border-right: 1px solid #222;
            padding: 28px 20px;
            background: #080808;
            display: flex;
            flex-direction: column;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 45px;
            padding-left: 10px;
        }

        .logo span {
            color: #ff6a00;
        }

        .navigation {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .navigation a {
            color: #aaa;
            text-decoration: none;
            padding: 13px 14px;
            border-radius: 10px;
        }

        .navigation a:hover,
        .navigation a.active {
            background: #151515;
            color: #fff;
        }

        .navigation a.active {
            border-left: 3px solid #ff6a00;
        }

        .creator {
            margin-top: auto;
            border-top: 1px solid #222;
            padding-top: 20px;
            color: #ff6a00;
            font-size: 12px;
            font-weight: 700;
        }

        .main {
            flex: 1;
            padding: 40px;
            max-width: 1000px;
        }

        .header {
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 30px;
        }

        .header p {
            color: #777;
            margin-top: 7px;
        }

        .profile-card {
            background: #0d0d0d;
            border: 1px solid #252525;
            border-radius: 20px;
            padding: 35px;
        }

        .profile-top {
            display: flex;
            align-items: center;
            gap: 22px;
            padding-bottom: 30px;
            border-bottom: 1px solid #222;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #181818;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
            color: #ff6a00;
        }

        .name {
            font-size: 28px;
            font-weight: 700;
        }

        .username {
            color: #888;
            margin-top: 5px;
        }

        .role {
            display: inline-block;
            margin-top: 12px;
            color: #ff6a00;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .citizen {
            color: #999;
            font-size: 13px;
            margin-top: 6px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .stat {
            background: #111;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 20px;
        }

        .stat-label {
            color: #777;
            font-size: 12px;
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            margin-top: 8px;
        }

        .wallet {
            margin-top: 25px;
            background: #111;
            border: 1px solid #222;
            border-radius: 14px;
            padding: 20px;
        }

        .wallet-title {
            color: #777;
            font-size: 12px;
        }

        .wallet-status {
            margin-top: 8px;
            color: #aaa;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        .button {
            padding: 13px 20px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            border: 1px solid #333;
            color: #fff;
        }

        .button.primary {
            background: #ff6a00;
            border-color: #ff6a00;
            color: #000;
        }

        @media (max-width: 700px) {

            .sidebar {
                width: 70px;
                padding: 20px 10px;
            }

            .logo {
                font-size: 0;
                text-align: center;
                padding: 0;
            }

            .logo::after {
                content: "CID";
                font-size: 20px;
                color: #ff6a00;
            }

            .navigation a {
                font-size: 0;
                text-align: center;
            }

            .creator {
                display: none;
            }

            .main {
                padding: 25px 18px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .profile-top {
                align-items: flex-start;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            Connect<span>ID</span>
        </div>

        <nav class="navigation">
            <a href="home.html">Home</a>
            <a href="messages.html">Messages</a>
            <a href="connections.html">Connections</a>
            <a href="communities.html">Communities</a>
            <a href="profile.html" class="active">Profile</a>
        </nav>

        <div class="creator">
            CREATOR
        </div>

    </aside>


    <main class="main">

        <div class="header">
            <h1>Your Identity</h1>
            <p>Your ConnectID profile and Citizen status.</p>
        </div>


        <div class="profile-card">

            <div class="profile-top">

                <div class="avatar">
                    S
                </div>

                <div>
                    <div class="name">Sean</div>
                    <div class="username">@sean</div>

                    <div class="role">
                        CREATOR
                    </div>

                    <div class="citizen">
                        Citizen
                    </div>
                </div>

            </div>


            <div class="stats">

                <div class="stat">
                    <div class="stat-label">
                        REPUTATION
                    </div>

                    <div class="stat-value">
                        0
                    </div>
                </div>


                <div class="stat">
                    <div class="stat-label">
                        CONNECTIONS
                    </div>

                    <div class="stat-value">
                        0
                    </div>
                </div>


                <div class="stat">
                    <div class="stat-label">
                        IDENTITY
                    </div>

                    <div class="stat-value">
                        Citizen
                    </div>
                </div>

            </div>


            <div class="wallet">

                <div class="wallet-title">
                    OPTIONAL WALLET
                </div>

                <div class="wallet-status">
                    No wallet connected
                </div>

            </div>


            <div class="buttons">

                <a href="home.html" class="button primary">
                    Back to Home
                </a>

            </div>

        </div>

    </main>

</div>

</body>
</html>
