<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ConnectID Profile</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b0b0b;
            color: #ffffff;
            min-height: 100vh;
        }

        header {
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 28px;
            border-bottom: 1px solid #222;
            background: #101010;
        }

        .logo {
            font-size: 22px;
            font-weight: 700;
        }

        .logo span {
            color: #ff7a00;
        }

        .profile {
            max-width: 700px;
            margin: 50px auto;
            padding: 20px;
        }

        .profile-card {
            background: #121212;
            border: 1px solid #252525;
            border-radius: 20px;
            padding: 35px;
        }

        .top {
            display: flex;
            align-items: center;
            gap: 22px;
            margin-bottom: 30px;
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: #ff7a00;
            color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            font-weight: 700;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .username {
            color: #ff7a00;
        }

        .citizen {
            display: inline-block;
            margin-top: 10px;
            padding: 6px 10px;
            border-radius: 20px;
            background: #1d1d1d;
            color: #bdbdbd;
            font-size: 12px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat {
            background: #0d0d0d;
            border: 1px solid #242424;
            border-radius: 12px;
            padding: 18px;
        }

        .stat-title {
            color: #777;
            font-size: 12px;
            margin-bottom: 7px;
        }

        .stat-value {
            font-size: 20px;
            font-weight: 700;
        }

        .wallet {
            padding: 18px;
            border-radius: 12px;
            background: #0d0d0d;
            border: 1px solid #242424;
            color: #777;
            margin-bottom: 25px;
        }

        .wallet strong {
            color: #fff;
        }

        .actions {
            display: flex;
            gap: 12px;
        }

        button {
            flex: 1;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #333;
            background: #171717;
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .primary {
            background: #ff7a00;
            color: #000;
            border: none;
        }

        @media (max-width: 600px) {
            .profile {
                margin: 25px auto;
            }

            .profile-card {
                padding: 25px;
            }

            .top {
                align-items: flex-start;
            }

            .stats {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">
        Connect<span>ID</span>
    </div>
</header>

<main class="profile">

    <div class="profile-card">

        <div class="top">

            <div class="avatar">
                C
            </div>

            <div>
                <h1>Sean</h1>
                <div class="username">@sean</div>
                <div class="citizen">
                    Citizen
                </div>
            </div>

        </div>

        <div class="stats">

            <div class="stat">
                <div class="stat-title">
                    Reputation
                </div>

                <div class="stat-value">
                    0
                </div>
            </div>

            <div class="stat">
                <div class="stat-title">
                    Connections
                </div>

                <div class="stat-value">
                    0
                </div>
            </div>

        </div>

        <div class="wallet">

            <strong>Wallet</strong><br>

            No wallet connected.

            <br><br>

            Wallet connection is optional.
            You can use ConnectID without cryptocurrency.

        </div>

        <div class="actions">

            <button class="primary">
                Find people
            </button>

            <button>
                Messages
            </button>

        </div>

    </div>

</main>

</body>
</html>
