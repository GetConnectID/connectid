<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create your ConnectID</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 460px;
            background: #111111;
            border: 1px solid #292929;
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        .logo {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .logo span {
            color: #ff7a00;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 30px;
        }

        .subtitle {
            color: #999999;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #cccccc;
        }

        input {
            width: 100%;
            padding: 14px 15px;
            margin-bottom: 20px;
            background: #080808;
            color: #ffffff;
            border: 1px solid #333333;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #ff7a00;
        }

        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: #202020;
            border: 1px solid #333333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #777777;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            border: 0;
            border-radius: 10px;
            padding: 15px;
            background: #ff7a00;
            color: #ffffff;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        .note {
            margin-top: 18px;
            font-size: 13px;
            color: #777777;
            line-height: 1.5;
        }

        .login {
            margin-top: 25px;
            text-align: center;
            font-size: 14px;
            color: #888888;
        }

        .login a {
            color: #ff7a00;
            text-decoration: none;
        }

        @media (max-width: 500px) {
            .card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

<div class="card">

    <div class="logo">
        Connect<span>ID</span>
    </div>

    <h1>Create your ConnectID</h1>

    <div class="subtitle">
        Create your identity and become a Citizen of ConnectID.
    </div>

    <form action="backend/register.php" method="POST">

        <label for="display_name">Display name</label>
        <input
            type="text"
            id="display_name"
            name="display_name"
            placeholder="Your name"
            maxlength="80"
            required
        >

        <label for="username">Username</label>
        <input
            type="text"
            id="username"
            name="username"
            placeholder="@username"
            maxlength="30"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            minlength="8"
            required
        >

        <label for="password_confirm">Confirm password</label>
        <input
            type="password"
            id="password_confirm"
            name="password_confirm"
            placeholder="Repeat your password"
            minlength="8"
            required
        >

        <div class="avatar">
            Avatar
        </div>

        <button type="submit">
            Become a Citizen
        </button>

    </form>

    <div class="note">
        A wallet is optional. You do not need crypto to become a Citizen.
    </div>

    <div class="login">
        Already have a ConnectID?
        <a href="login.html">Sign in</a>
    </div>

</div>

</body>
</html>
