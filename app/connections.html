<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connections | ConnectID</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #050505;
            color: #fff;
        }

        .app {
            min-height: 100vh;
            display: flex;
        }

        .sidebar {
            width: 230px;
            background: #080808;
            border-right: 1px solid #222;
            padding: 28px 18px;
        }

        .logo {
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 40px;
            padding-left: 10px;
        }

        .logo span {
            color: #ff6a00;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        nav a {
            color: #999;
            text-decoration: none;
            padding: 13px;
            border-radius: 9px;
        }

        nav a:hover,
        nav a.active {
            background: #151515;
            color: #fff;
        }

        nav a.active {
            border-left: 3px solid #ff6a00;
        }

        .main {
            flex: 1;
            padding: 40px;
            max-width: 950px;
        }

        h1 {
            font-size: 30px;
        }

        .subtitle {
            color: #777;
            margin-top: 8px;
        }

        .search {
            margin-top: 30px;
            width: 100%;
            max-width: 600px;
            padding: 14px;
            background: #111;
            border: 1px solid #292929;
            border-radius: 10px;
            color: #fff;
            outline: none;
        }

        .person {
            margin-top: 25px;
            max-width: 600px;
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 18px;
            background: #0d0d0d;
            border: 1px solid #222;
            border-radius: 14px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #191919;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff6a00;
            font-weight: 700;
        }

        .name {
            font-weight: 700;
        }

        .username {
            color: #777;
            font-size: 13px;
            margin-top: 4px;
        }

        .connect {
            margin-left: auto;
            padding: 10px 17px;
            background: #ff6a00;
            color: #000;
            border: none;
            border-radius: 8px;
            font-weight: 700;
        }

        @media (max-width: 700px) {

            .sidebar {
                width: 65px;
                padding: 20px 8px;
            }

            .logo {
                font-size: 0;
                text-align: center;
                padding: 0;
            }

            .logo::after {
                content: "CID";
                color: #ff6a00;
                font-size: 18px;
            }

            nav a {
                font-size: 0;
                text-align: center;
            }

            .main {
                padding: 25px 18px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            Connect<span>ID</span>
        </div>

        <nav>
            <a href="home.html">Home</a>
            <a href="messages.html">Messages</a>
            <a href="connections.html" class="active">Connections</a>
            <a href="communities.html">Communities</a>
            <a href="profile.html">Profile</a>
        </nav>

    </aside>


    <main class="main">

        <h1>Connections</h1>

        <p class="subtitle">
            Connect with Citizens and build your network.
        </p>

        <input
            class="search"
            type="text"
            placeholder="Search by @username"
        >


        <div class="person">

            <div class="avatar">
                J
            </div>

            <div>
                <div class="name">
                    John
                </div>

                <div class="username">
                    @john · Citizen
                </div>
            </div>

            <button class="connect">
                Connect
            </button>

        </div>

    </main>

</div>

</body>
</html>
